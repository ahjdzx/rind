# 腾讯会议（Tencent Meeting / VooV）。路径来自 Homebrew cask `tencent-meeting` 的 zap 段，并在本机核对过。
bundle_id = "com.tencent.meeting"
name = "腾讯会议"
aliases = ["TencentMeeting", "Tencent Meeting", "wemeet"]

[[paths]]
path = "~/Library/Containers/com.tencent.meeting"
confidence = "certain"
note = "沙盒容器"

[[paths]]
path = "~/Library/Containers/com.tencent.meeting.*"
confidence = "certain"

[[paths]]
path = "~/Library/Containers/com.tencent.wemeet.FileDelta"
confidence = "likely"

[[paths]]
path = "~/Library/Application Support/com.tencent.meeting*"
