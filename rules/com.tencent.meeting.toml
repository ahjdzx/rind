[[paths]]
path = "~/Library/com.tencent.meeting"
confidence = "likely"
note = "直接放在 Library 下的日志与缓存"

[[paths]]
path = "~/Library/Group Containers/*.com.tencent.meeting"
confidence = "certain"

[[paths]]
path = "~/Library/Application Scripts/*.com.tencent.meeting"
confidence = "certain"

[[paths]]
path = "~/Library/Application Scripts/com.tencent.meeting"
confidence = "certain"

[[paths]]
path = "~/Library/HTTPStorages/com.tencent.meeting*"
confidence = "certain"

[[paths]]
path = "~/Library/Preferences/com.tencent.meeting*.plist"
confidence = "certain"

[[paths]]
path = "~/Library/Saved Application State/com.tencent.meeting.savedState"
confidence = "certain"

[[paths]]
path = "~/Library/WebKit/com.tencent.meeting"
confidence = "certain"
