[workspace]
resolver = "2"
members = ["crates/rind-core", "crates/rind-i18n", "crates/rind-cli", "crates/rind-app"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ahjdzx/rind"
rust-version = "1.85"

[workspace.dependencies]
rind-core = { path = "crates/rind-core" }
rind-i18n = { path = "crates/rind-i18n" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
plist = "1"
walkdir = "2"
rayon = "1"
dirs = "6"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
